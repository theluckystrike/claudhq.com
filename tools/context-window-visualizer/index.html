<body>
    <div class="container">
        <header>
            <h1>Context Window Visualizer</h1>
            <p class="subtitle">Monitor token allocation and context capacity</p>
        </header>

        <div class="controls">
            <div class="control-row">
                <div class="control-group">
                    <label for="model">Model</label>
                    <select id="model" onchange="updateModel()">
                        <option value="haiku">Claude 3.5 Haiku (200K)</option>
                        <option value="sonnet">Claude 3.5 Sonnet (200K)</option>
                        <option value="opus">Claude Opus 4.6 (200K)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="systemPrompt">System Prompt Size (tokens)</label>
                    <input type="number" id="systemPrompt" placeholder="0" value="500" min="0" oninput="updateVisualization()">
                </div>
            </div>
            <div class="control-row">
                <div class="control-group">
                    <label for="userPrompt">User Prompt (tokens)</label>
                    <input type="number" id="userPrompt" placeholder="0" value="1000" min="0" oninput="updateVisualization()">
                </div>
                <div class="control-group">
                    <label for="history">Conversation History (tokens)</label>
                    <input type="number" id="history" placeholder="0" value="5000" min="0" oninput="updateVisualization()">
                </div>
            </div>
            <div class="control-row">
                <div class="control-group">
                    <label for="files">File Contents (tokens)</label>
                    <input type="number" id="files" placeholder="0" value="10000" min="0" oninput="updateVisualization()">
                </div>
                <div class="control-group">
                    <label for="tools">Tool Schemas (tokens)</label>
                    <input type="number" id="tools" placeholder="0" value="2000" min="0" oninput="updateVisualization()">
                </div>
            </div>
            <div class="button-group">
                <button class="btn-primary" onclick="updateVisualization()">Update Visualization</button>
                <button class="btn-secondary" onclick="resetForm()">Reset</button>
            </div>
        </div>

        <div class="warning" id="warningBox">
            <div class="warning-title">⚠ Context Exceeded</div>
            <div class="warning-message" id="warningText"></div>
        </div>

        <div class="model-info" id="modelInfo"></div>

        <div class="stats-grid" id="statsGrid"></div>

        <div class="visualization">
            <div class="vis-title">Token Allocation</div>
            <div class="context-bar" id="contextBar"></div>
            <div class="legend" id="legend"></div>
        </div>
    </div>

    <footer>
        © 2026 claudhq.com — Claude Code Resources
    </footer>

    <script>
        const models = {
            haiku: { name: 'Claude 3.5 Haiku', capacity: 200000 },
            sonnet: { name: 'Claude 3.5 Sonnet', capacity: 200000 },
            opus: { name: 'Claude Opus 4.6', capacity: 200000 }
        };

        function updateModel() {
            updateVisualization();
        }

        function updateVisualization() {
            const model = document.getElementById('model').value;
            const system = parseInt(document.getElementById('systemPrompt').value) || 0;
            const user = parseInt(document.getElementById('userPrompt').value) || 0;
            const history = parseInt(document.getElementById('history').value) || 0;
            const files = parseInt(document.getElementById('files').value) || 0;
            const tools = parseInt(document.getElementById('tools').value) || 0;

            const modelInfo = models[model];
            const total = system + user + history + files + tools;
            const remaining = Math.max(0, modelInfo.capacity - total);
            const isExceeded = total > modelInfo.capacity;

            // Update model info
            document.getElementById('modelInfo').innerHTML = `
                <div class="model-info-text">
                    <strong>${modelInfo.name}</strong> — ${modelInfo.capacity.toLocaleString()} token capacity
                </div>
            `;

            // Update warning
            const warningBox = document.getElementById('warningBox');
            if (isExceeded) {
                warningBox.classList.add('active');
                document.getElementById('warningText').textContent =
                    `Total usage (${total.toLocaleString()} tokens) exceeds ${modelInfo.name} capacity (${modelInfo.capacity.toLocaleString()} tokens). Remove context or switch to larger model.`;
            } else {
                warningBox.classList.remove('active');
            }

            // Update stats
            updateStats(system, user, history, files, tools, remaining, modelInfo.capacity);

            // Update visualization
            updateContextBar(system, user, history, files, tools, remaining, modelInfo.capacity);
        }

        function updateStats(system, user, history, files, tools, remaining, capacity) {
            const total = system + user + history + files + tools;
            const usagePercent = ((total / capacity) * 100).toFixed(1);

            const html = `
                <div class="stat-card">
                    <div class="stat-label">System Prompt</div>
                    <div class="stat-value">${system.toLocaleString()}</div>
                    <div class="stat-percent">${((system / capacity) * 100).toFixed(1)}%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">User Prompt</div>
                    <div class="stat-value">${user.toLocaleString()}</div>
                    <div class="stat-percent">${((user / capacity) * 100).toFixed(1)}%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">History</div>
                    <div class="stat-value">${history.toLocaleString()}</div>
                    <div class="stat-percent">${((history / capacity) * 100).toFixed(1)}%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Files</div>
                    <div class="stat-value">${files.toLocaleString()}</div>
                    <div class="stat-percent">${((files / capacity) * 100).toFixed(1)}%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Tool Schemas</div>
                    <div class="stat-value">${tools.toLocaleString()}</div>
                    <div class="stat-percent">${((tools / capacity) * 100).toFixed(1)}%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Remaining</div>
                    <div class="stat-value">${remaining.toLocaleString()}</div>
                    <div class="stat-percent">${((remaining / capacity) * 100).toFixed(1)}%</div>
                </div>
            `;

            document.getElementById('statsGrid').innerHTML = html;
        }

        function updateContextBar(system, user, history, files, tools, remaining, capacity) {
            const total = system + user + history + files + tools;

            const segments = [
                { label: 'System Prompt', value: system, class: 'segment-system' },
                { label: 'User Prompt', value: user, class: 'segment-user' },
                { label: 'History', value: history, class: 'segment-history' },
                { label: 'Files', value: files, class: 'segment-files' },
                { label: 'Tools', value: tools, class: 'segment-tools' },
                { label: 'Remaining', value: remaining, class: 'segment-remaining' }
            ];

            let barHtml = '';
            let position = 0;

            segments.forEach(seg => {
                if (seg.value > 0) {
                    const percent = (seg.value / (total + remaining)) * 100;
                    const displayPercent = percent < 3 ? 0 : percent;
                    const displayLabel = percent < 5 ? '' : `${seg.label}`;

                    barHtml += `
                        <div class="context-segment ${seg.class}"
                             style="left: ${position}%; width: ${percent}%;"
                             title="${seg.label}: ${seg.value.toLocaleString()} tokens (${displayPercent.toFixed(1)}%)">
                            ${displayLabel}
                        </div>
                    `;
                    position += percent;
                }
            });

            document.getElementById('contextBar').innerHTML = barHtml;

            // Update legend
            let legendHtml = '';
            segments.forEach(seg => {
                if (seg.value > 0) {
                    legendHtml += `
                        <div class="legend-item">
                            <div class="legend-color ${seg.class}"></div>
                            <div class="legend-info">
                                <div class="legend-label">${seg.label}</div>
                                <div class="legend-value">${seg.value.toLocaleString()} tokens</div>
                            </div>
                        </div>
                    `;
                }
            });

            document.getElementById('legend').innerHTML = legendHtml;
        }

        function resetForm() {
            document.getElementById('model').value = 'sonnet';
            document.getElementById('systemPrompt').value = '500';
            document.getElementById('userPrompt').value = '1000';
            document.getElementById('history').value = '5000';
            document.getElementById('files').value = '10000';
            document.getElementById('tools').value = '2000';
            updateVisualization();
        }

        // Initial render
        updateVisualization();
    </script>
